<fieldset class="workflow-fieldset innovation-controls">
  <legend>创新程度</legend>
  <div class="workflow-segmented" role="radiogroup" aria-label="创新程度">
    <label class="workflow-segment"><input type="radio" name="innovation_level" value="minimal" {% if innovation_default.level == 'minimal' %}checked{% endif %}><span>最小</span><small>沿当前轨道推进</small></label>
    <label class="workflow-segment"><input type="radio" name="innovation_level" value="low" {% if innovation_default.level == 'low' %}checked{% endif %}><span>低</span><small>轻微拓展</small></label>
    <label class="workflow-segment"><input type="radio" name="innovation_level" value="medium" {% if innovation_default.level == 'medium' %}checked{% endif %}><span>中</span><small>平衡连续与变化</small></label>
    <label class="workflow-segment"><input type="radio" name="innovation_level" value="high" {% if innovation_default.level == 'high' %}checked{% endif %}><span>高</span><small>主动打开新方向</small></label>
    <label class="workflow-segment"><input type="radio" name="innovation_level" value="bold" {% if innovation_default.level == 'bold' %}checked{% endif %}><span>大胆</span><small>积极探索远线</small></label>
  </div>
</fieldset>
<fieldset class="workflow-fieldset innovation-controls">
  <legend>创新方向</legend>
  <div class="workflow-chip-group" role="group" aria-label="创新方向">
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="auto" {% if 'auto' in innovation_default.focus %}checked{% endif %} data-innovation-auto><span>自动</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="plot" {% if 'plot' in innovation_default.focus %}checked{% endif %}><span>剧情</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="character" {% if 'character' in innovation_default.focus %}checked{% endif %}><span>人物</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="relationship" {% if 'relationship' in innovation_default.focus %}checked{% endif %}><span>关系</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="world" {% if 'world' in innovation_default.focus %}checked{% endif %}><span>世界</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="mechanism" {% if 'mechanism' in innovation_default.focus %}checked{% endif %}><span>机制</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="narrative_structure" {% if 'narrative_structure' in innovation_default.focus %}checked{% endif %}><span>叙事结构</span></label>
    <label class="workflow-chip"><input type="checkbox" name="innovation_focus" value="style" {% if 'style' in innovation_default.focus %}checked{% endif %}><span>文风</span></label>
  </div>
  <p class="workflow-helper">选择“自动”会清除其他方向；选择任意具体方向会自动取消“自动”。</p>
</fieldset>
